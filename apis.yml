name: Money View
description: Moneyview is an Indian consumer fintech platform offering a suite of financial services including
  personal loans (up to Rs 10L), home loans, business loans, loans against property, credit cards, fixed
  deposits, digital gold, motor insurance, credit tracking, and UPI payments. The platform reports serving
  over 12 crore users across 18,400+ pincodes. Moneyview publishes ISO 27001:2022 and PCI DSS certifications
  and a responsible vulnerability disclosure program, but exposes no public developer API, developer portal,
  or OpenAPI surface. This profile was surfaced as a portfolio company of Accel and enriched by the API
  Evangelist pipeline.
